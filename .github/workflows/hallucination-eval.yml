name: Hallucination Eval
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # segundas, 09:00 UTC

# Os tres evals medem coisas DIFERENTES e nenhum substitui o outro:
#   hallucination_eval  — relatorio diario contra dados congelados
#   grounding_eval      — UMA resposta de conversa, com armadilha plantada na fonte
#   news_recall_eval    — a CONVERSA inteira sobre um alerta ja enviado (o incidente
#                         de 18/08/2026 foi cinco respostas diferentes ao longo de
#                         uma conversa, nao um erro numa resposta isolada)
#
# `continue-on-error` em cada passo de propriedade: o relatorio so tem valor se os
# tres numeros aparecerem juntos. Um eval que estoura nao pode esconder os outros
# dois — e nenhum deles bloqueia merge, sao medicao, nao portao.

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt

      - name: Relatorio diario (hallucination)
        id: diario
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m backend.evals.hallucination_eval | tee eval-diario.txt

      - name: Conversa, resposta isolada (grounding)
        id: grounding
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m backend.evals.grounding_eval | tee eval-grounding.txt

      - name: Conversa sobre alerta enviado (news recall)
        id: recall
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m backend.evals.news_recall_eval | tee eval-recall.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Evals de alucinacao'
            echo ''
            echo "| eval | resultado |"
            echo "|---|---|"
            echo "| relatorio diario | ${{ steps.diario.outcome }} |"
            echo "| conversa (grounding) | ${{ steps.grounding.outcome }} |"
            echo "| conversa sobre alerta (recall) | ${{ steps.recall.outcome }} |"
            for f in eval-diario.txt eval-grounding.txt eval-recall.txt; do
              [ -f "$f" ] || continue
              echo ''
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

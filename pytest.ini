[pytest]
pythonpath = .
asyncio_mode = auto
# Só `backend/`: `_deprecated/` guarda testes de código aposentado e `.claude/worktrees/`
# cópias da suíte — rodar `pytest` puro na raiz pegava os dois.
testpaths = backend
markers =
    unit: testes determinísticos sem rede (rodam no CI gate)
    smoke: chamadas reais ao Claude para conferência visual (não rodam no CI)
